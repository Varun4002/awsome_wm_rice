# picom — compositor for AwesomeWM.
#
# Two consumers of compositing on this desktop:
#
#   1. Starlight — a translucent ARGB launcher (its own alpha).
#   2. Every managed window — the frosted-glass look.  Awesome sets
#      _NET_WM_WINDOW_OPACITY on the WM frame (see glass.lua); picom reads
#      that opacity, blurs the desktop behind the window and rounds its
#      corners.  Because the frame's background is transparent, the client
#      alpha is composited straight onto the blurred backdrop.
#
# Tuning:
#   blur-strength 0..20      glass frostiness (higher = more diffuse)
#   corner-radius px         shared by tiled and floating windows
#   shadow-* below           keep it subtle; 0 opacity disables shadows
#
# Run `picom --config ~/.config/picom/picom.conf --diagnostics` to verify the
# backend, and `picom-trans` to inspect a window's effective opacity.

backend = "glx";
vsync = true;
detect-client-opacity = true;

# --- background blur -------------------------------------------------------
# dual_kawase is the fastest high quality method and the only blur that works
# well on the GLX backend.  blur-background-fixed keeps the frost strength
# constant instead of scaling it with the window's opacity, so focused and
# unfocused windows look like the same material at different tint levels.
blur-background = true;
blur-background-fixed = true;
blur-method = "dual_kawase";
blur-strength = 8;

# --- rounded corners ------------------------------------------------------
corner-radius = 12;
# Per-window overrides (including the wibox exclusion — glass.lua shapes the
# titlebar itself, top corners only, and the bar must line up exactly with
# the panel's rounded outline) live in the window rules section below.

# --- shadows --------------------------------------------------------------
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.35;
shadow-offset-x = 0;
shadow-offset-y = 6;

# --- transitions ----------------------------------------------------------
# Fade focus/opacity changes and open/close.  The short steps keep focus
# switching snappy instead of syrupy.  For open/close/minimize the window
# animations below take precedence (docs: "when animations are used, this
# will have no effect") — fading still covers whatever those scripts do not.
fading = true;
fade-delta = 8;
fade-in-step = 0.06;
fade-out-step = 0.06;

# --- window animations ----------------------------------------------------
# v13's animation system is preset based: appear/disappear (scale + fade)
# is the macOS zoom feel; slide/fly cross the screen and are too much for
# window management.  There are no spring knobs in this build — duration is
# the only feel control, kept short so windows settle quickly.
animations = ({
    triggers = [ "open", "show" ];
    preset = "appear";
    scale = 0.9;
    duration = 0.18;
    # the preset fades on its own; keep the opacity-change script below
    # from interrupting it mid-zoom
    suppressions = [ "increase-opacity", "decrease-opacity" ];
}, {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    scale = 0.9;
    duration = 0.13;
    suppressions = [ "increase-opacity", "decrease-opacity" ];
}, {
    # glass.lua drives _NET_WM_WINDOW_OPACITY on focus changes; animate that
    # transition the way fading used to.  window-raw-opacity-before /
    # window-raw-opacity are the documented old/new values, and they are
    # only valid at trigger time, so use them in start/end only.
    triggers = [ "increase-opacity", "decrease-opacity" ];
    opacity = {
        duration = 0.15;
        start = "window-raw-opacity-before";
        end = "window-raw-opacity";
    };
});

# --- window rules ---------------------------------------------------------
# Replaces the old shadow/blur/corner exclude lists: when "rules" is set,
# picom ignores shadow-exclude / blur-background-exclude /
# rounded-corners-exclude and warns on every one of them, so all per-window
# overrides live here.  Rules match in order; the last match of each option
# wins.  An animation script with triggers but no timing function is the
# documented no-op ("nothing will be animated and the animation will end
# instantly") — that is how these windows opt out of the animations above.
rules = (
    # Chrome: static, no glass, no shadow, no motion.
    { match = "window_type = 'desktop' || window_type = 'dock' || window_type = 'notification'";
      shadow = false; blur-background = false; corner-radius = 0;
      animations = ({ triggers = [ "open", "close", "show", "hide" ]; }); },
    # Awesome's own wiboxes: no shadow, no corners, but keep the frost.
    { match = "class_g = 'awesome' && window_type = 'normal'";
      shadow = false; corner-radius = 0;
      animations = ({ triggers = [ "open", "close", "show", "hide" ]; }); },
    # Fullscreen: bypass territory.  Also restores the legacy behaviour that
    # rounded corners are auto-disabled for fullscreen windows — rules mode
    # no longer does that by default.
    { match = "fullscreen";
      shadow = false; blur-background = false; corner-radius = 0;
      animations = ({ triggers = [ "open", "close", "show", "hide" ]; }); },
    # slop's selection rectangle must not get shadows or glass.
    { match = "class_g = 'slop'";
      shadow = false; blur-background = false;
      animations = ({ triggers = [ "open", "close", "show", "hide" ]; }); },
    # Starlight does its own reveal choreography — no double animation.
    { match = "class_g = 'starlight'";
      animations = ({ triggers = [ "open", "close", "show", "hide" ]; }); },
    # The popovers and the volume OSD are window_type 'menu' wiboxes. The
    # Lua side maps/unmaps them instantly and picom draws the motion here,
    # GPU-side: a WM-thread tween on a blurred, shadowed wibox costs a full
    # repaint plus a blur re-composite per frame. They keep their shadow,
    # frost and corners (legacy never excluded them from those).
    { match = "window_type = 'menu'";
      animations = (
        { triggers = [ "open", "show" ]; preset = "appear";
          scale = 0.96; duration = 0.12;
          suppressions = [ "increase-opacity", "decrease-opacity" ]; },
        { triggers = [ "close", "hide" ]; preset = "disappear";
          scale = 0.96; duration = 0.09;
          suppressions = [ "increase-opacity", "decrease-opacity" ]; }
      ); },
);

# Let fullscreen games/video bypass the compositor entirely.
unredir-if-possible = true;
