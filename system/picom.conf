# picom — compositor for AwesomeWM.
#
# Two consumers of compositing on this desktop:
#
#   1. Starlight — a translucent ARGB launcher (its own alpha).
#   2. Every managed window — the frosted-glass look.  Awesome sets
#      _NET_WM_WINDOW_OPACITY on the WM frame (see glass.lua); picom reads
#      that opacity, blurs the desktop behind the window and rounds its
#      corners.  Because the frame's background is transparent, the client
#      alpha is composited straight onto the blurred backdrop.
#
# Tuning:
#   blur-strength 0..20      glass frostiness (higher = more diffuse)
#   corner-radius px         shared by tiled and floating windows
#   shadow-* below           keep it subtle; 0 opacity disables shadows
#
# Run `picom --config ~/.config/picom/picom.conf --diagnostics` to verify the
# backend, and `picom-trans` to inspect a window's effective opacity.

backend = "glx";
vsync = true;
detect-client-opacity = true;

# --- background blur -------------------------------------------------------
# dual_kawase is the fastest high quality method and the only blur that works
# well on the GLX backend.  blur-background-fixed keeps the frost strength
# constant instead of scaling it with the window's opacity, so focused and
# unfocused windows look like the same material at different tint levels.
blur-background = true;
blur-background-fixed = true;
blur-method = "dual_kawase";
blur-strength = 8;
blur-background-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "window_type = 'notification'",
    "fullscreen",
    "class_g = 'slop'",
];

# --- rounded corners ------------------------------------------------------
corner-radius = 12;
# Awesome wiboxes are excluded because glass.lua shapes the titlebar itself
# (top corners only) and the bar must line up exactly with the panel's rounded
# outline; picom rounding it would also round its bottom edge.
rounded-corners-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "window_type = 'notification'",
    "class_g = 'awesome' && window_type = 'normal'",
    "fullscreen",
];

# --- shadows --------------------------------------------------------------
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.35;
shadow-offset-x = 0;
shadow-offset-y = 6;
shadow-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "window_type = 'notification'",
    "class_g = 'awesome' && window_type = 'normal'",
    "fullscreen",
    "class_g = 'slop'",
];

# --- transitions ----------------------------------------------------------
# Fade focus/opacity changes and open/close.  The short steps keep focus
# switching snappy instead of syrupy.
fading = true;
fade-delta = 8;
fade-in-step = 0.06;
fade-out-step = 0.06;

# Let fullscreen games/video bypass the compositor entirely.
unredir-if-possible = true;
